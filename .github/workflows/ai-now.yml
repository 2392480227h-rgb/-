name: Refresh AI NOW

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-now-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect public AI sources
        run: node scripts/news/fetch-ai-news.mjs

      - name: Validate feed
        run: node scripts/news/validate-ai-news.mjs

      - name: Commit changes when fresh content arrived
        id: commit
        run: |
          git config user.name "ai-starter-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai-news.json
          if git diff --cached --quiet; then
            echo "No news changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: refresh AI NOW feed"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request Pages deployment
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" -f event_type=site-data-updated
