name: Curate Tool Tutorial Videos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  curate:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[curate-videos]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Curate concrete YouTube tutorials
        run: node scripts/curate-tool-videos.mjs

      - name: Show diff
        run: git diff --stat && git diff -- tutorials/tutorial-data.js | head -n 300

      - name: Commit curated videos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tutorials/tutorial-data.js
          git diff --cached --quiet && echo "No changes to commit." && exit 0
          git commit -m "data: curate concrete tutorial videos for all tools"
          git push
