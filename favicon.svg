<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" width="144" height="144" role="img" aria-labelledby="t d">
<title id="t">AI Starter Hub mark</title>
<desc id="d">Symmetrical silver geometric A and I emblem with a horizontal beam.</desc>
<defs>
  <linearGradient id="silverA" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F8FAFC"/>
    <stop offset=".28" stop-color="#D7DDE5"/>
    <stop offset=".58" stop-color="#8C96A3"/>
    <stop offset=".82" stop-color="#EEF2F6"/>
    <stop offset="1" stop-color="#AAB3BE"/>
  </linearGradient>
  <linearGradient id="silverI" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset=".35" stop-color="#DCE2E9"/>
    <stop offset=".65" stop-color="#A7B0BC"/>
    <stop offset="1" stop-color="#E9EDF2"/>
  </linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8D97A3"/>
    <stop offset=".18" stop-color="#E3E7EC"/>
    <stop offset=".5" stop-color="#FFFFFF"/>
    <stop offset=".82" stop-color="#E3E7EC"/>
    <stop offset="1" stop-color="#8D97A3"/>
  </linearGradient>
</defs>
