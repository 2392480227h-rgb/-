<!-- horizontal beam, intentionally +20% heavier -->
<path fill="url(#beam)" d="M9 69 L64 64 L72 63 L80 64 L135 69 L80 75 L72 76 L64 75 Z"/>
<path fill="#FFFFFF" opacity=".72" d="M10 69 L64 65 L72 64 L80 65 L134 69 L80 70 L72 70 L64 70 Z"/>
</svg>