const tips={
"聊天 / 综合":["先从一个具体问题开始，不要追求复杂 Prompt。","Start with one concrete task. You do not need a complicated prompt.","请用简单的话解释一下这个问题，并给我 3 个例子。"],
"搜索 / 研究":["先说清楚你要找什么，再要求来源或整理成表格。","State what you need to find, then ask for sources or a table.","帮我查找这个主题的关键信息，并列出来源。"],
"学习 / 研究":["把不会的概念直接交给 AI，让它用你能看懂的方式解释。","Ask the AI to explain difficult ideas at your level.","请像给零基础的人上课一样解释这个知识点。"],
"图片":["先描述主体、场景、风格和画面比例，再生成。","Describe the subject, scene, style, and aspect ratio before generating.","生成一张简洁、干净、适合手机壁纸的图片。"],
"图片 / 设计":["先确定用途，再让 AI 给出构图或设计方案。","Start with the purpose, then ask for a layout or design concept.","我要做一张宣传图，请给我一个适合手机屏幕的设计方案。"],

"视频":["先从 5 到 10 秒的小片段开始，熟悉生成和导出流程。","Start with a short 5–10 second clip to learn the workflow.","生成一个 8 秒的短视频，画面稳定，主体清晰。"],
"音频 / 配音":["先输入一小段文字测试声音和语速，再制作完整内容。","Test a short sentence first, then produce the full audio.","把这段文字转换成自然、清晰的普通话语音。"],
"音乐":["先确定风格、情绪、乐器和用途，再生成。","Describe genre, mood, instruments, and intended use.","生成一段轻快、温暖、适合学习时播放的背景音乐。"],
"编程":["先让 AI 解释代码，再让它修改，最后自己运行验证。","Ask for an explanation first, then edits, and finally test the result yourself.","请解释这段代码，然后指出可能的错误，不要直接重写全部代码。"],
"本地 AI":["先安装软件，再下载一个适合自己电脑配置的模型。","Install the app first, then choose a model that fits your computer.","我电脑配置是……，推荐一个适合本地运行的模型。"],
"写作 / 办公":["先给目标、对象、语气和长度，再让 AI 起草。","Give the goal, audience, tone, and length before drafting.","帮我写一封礼貌、简短、150 字以内的邮件。"],
"翻译":["先直接翻译，再告诉 AI 你需要正式、口语或自然表达。","Translate first, then specify whether you want formal, casual, or natural wording.","把这段话翻译成自然的英文，不要直译。"],
"演示 / 文档":["先告诉 AI 主题、受众和页数，再生成初稿。","Give the topic, audience, and slide count before generating.","做一个 8 页的入门演示，面向完全不了解这个主题的人。"],
"会议 / 音频":["先上传或录制一段短会议，再检查转写和摘要是否准确。","Start with a short meeting recording and verify the transcript and summary.","把会议内容整理成：重点、决定、待办事项。"],

'<section class="section" id="tips"><h2>02｜使用技巧 <span>Practical tips</span></h2><div class="tip"><strong>中文：</strong>'+esc(d[0])+'<br><strong>English:</strong> '+esc(d[1])+'</div><div class="step"><h3>如果结果不对怎么办？ <span>What if the result is wrong?</span></h3><p>不要急着退出。直接告诉工具：哪里不对、你想要什么、有什么限制。</p><p>Do not restart immediately. Tell the tool what is wrong, what you want, and any constraints.</p></div></section>'+
'<section class="section" id="example"><h2>03｜第一次任务 <span>Your first task</span></h2><div class="prompt">'+esc(d[2])+'</div><p class="lead">把上面的示例直接复制进去，然后根据结果继续修改。<br>Copy the example above, try it, then refine the result.</p><div class="tip"><strong>万能补充：</strong>“再简单一点”“给我 3 个版本”“用表格整理”“告诉我哪里可能出错”。</div></section>'+
